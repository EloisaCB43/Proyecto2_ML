<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predicción de Viviendas</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

    <div class="container py-5">

    <div class="text-center mb-5">
        <h1 class="fw-bold">Predicción Inteligente de Viviendas</h1>
        <p class="text-muted">
            Modelo LightGBM + MLflow + FastAPI
        </p>
    </div>

    <div class="row">

        <div class="col-lg-7">

            <div class="card shadow-lg border-0 p-4 rounded-4">

                <form method="POST" action="/predict">


                    <div class="row g-3">

                        <div class="col-md-6">
                            <label class="form-label">Área Construida (m2)</label>
                            <input type="number" step="0.1" class="form-control" name="area" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Estrato</label>
                            <input type="number" class="form-control" name="estrato" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Baños</label>
                            <input type="number" class="form-control" name="banos" required>
                        </div>

                          <div class="col-md-6">
                            <label class="form-label">Habitaciones</label>
                            <input type="number" class="form-control" name="habitaciones" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Parqueaderos</label>
                            <input type="number" class="form-control" name="parqueaderos" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Tipo de Inmueble</label>
                            <input type="text" class="form-control" name="tipo_inmueble" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Estado</label>
                            <input type="text" class="form-control" name="estado" required>
                        </div>

                         <div class="col-md-6">
                            <label class="form-label">Antigüedad</label>
                            <input type="text" class="form-control" name="antiguedad" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Barrio</label>
                            <input type="text" class="form-control" name="barrio_group" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Piso</label>
                            <input type="text" class="form-control" name="piso_cat" required>
                        </div>

                         </div>

                    <div class="mt-4 d-grid">
                        <button class="btn btn-dark btn-lg rounded-3">
                            Predecir precio
                        </button>
                    </div>

                </form>

            </div>

        </div>

        <div class="col-lg-5 mt-4 mt-lg-0">

             <div class="card shadow-lg border-0 rounded-4 p-4 prediction-card">

                <h3 class="fw-bold mb-3">Resultado</h3>

                {% if prediction %}
                    <h1 class="display-5 fw-bold text-success">
                        {{ prediction }}
                    </h1>
                {% else %}
                    <p class="text-muted">
                        Ingresa las variables y genera una predicción.
                    </p>
                {% endif %}

                <hr>

                 <div>
                    <p><strong>Modelo:</strong> LightGBM</p>
                    <p><strong>Tracking:</strong> MLflow</p>
                    <p><strong>Optimización:</strong> Optuna</p>
                    <p><strong>Deployment:</strong> FastAPI</p>
                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
